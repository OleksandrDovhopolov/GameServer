services:
  api:
    build:
      context: .
      dockerfile: GameServer.Api/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - redis
    environment:
      - Redis__ConnectionString=redis:6379,abortConnect=false
      - ADMIN_USER=admin
      - ADMIN_PASS=admin
      - GooglePlayBilling__Enabled=${GOOGLE_PLAY_BILLING__ENABLED:-false}
      - GooglePlayBilling__PackageName=${GOOGLE_PLAY_BILLING__PACKAGE_NAME:-}
      - GooglePlayBilling__ServiceAccountJson=${GOOGLE_PLAY_BILLING__SERVICE_ACCOUNT_JSON:-}
      - GooglePlayBilling__ServiceAccountKeyFile=${GOOGLE_PLAY_BILLING__SERVICE_ACCOUNT_KEY_FILE:-/run/secrets/google-play-service-account.json}
      - GooglePlayBilling__ApplicationName=GameServer.Api
    # Optional fallback when you want to load credentials from a mounted file instead of env JSON.
    # volumes:
    #   - ./secrets/google-play-service-account.json:/run/secrets/google-play-service-account.json:ro

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
