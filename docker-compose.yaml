services:
  api:
    build:
      context: .
      dockerfile: GameServer.Api/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - redis
    environment:
      - Redis__ConnectionString=redis:6379,abortConnect=false
      - ADMIN_USER=admin
      - ADMIN_PASS=admin

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
