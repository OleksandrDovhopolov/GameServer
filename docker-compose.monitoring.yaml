name: gameserver-monitoring

# Separate compose project so deploy-vps.sh never touches it.
# It joins the app network to reach redis and postgres by service name.
#
# Start:  docker compose --env-file .env.monitoring -f docker-compose.monitoring.yaml up -d
# Status: docker compose --env-file .env.monitoring -f docker-compose.monitoring.yaml ps

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Loopback only: reachable through an SSH tunnel, never from the internet.
    ports:
      - "127.0.0.1:9090:9090"
    networks: [app]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
    volumes:
      - grafana_data:/var/lib/grafana
    # nginx on the host terminates TLS and proxies to this port.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks: [app]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [app]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
    networks: [app]
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN}
    networks: [app]
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  app:
    external: true
    name: gameserver-vps_default
