global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host: CPU, RAM, disk, network of the VPS itself.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Enable once GameServer.Api exposes /metrics; until then the target would be down.
  # - job_name: gameserver-api
  #   static_configs:
  #     - targets: ["api:8080"]
