apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameserver-api
  namespace: gameserver-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gameserver-api
  template:
    metadata:
      labels:
        app: gameserver-api
    spec:
      containers:
        - name: api
          image: ghcr.io/oleksandrdovhopolov/gameserver-api:sha-44a79ef
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gameserver-api-config
            - secretRef:
                name: gameserver-api-local
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
